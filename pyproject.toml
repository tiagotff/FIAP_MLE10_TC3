[tool.poetry]
name = "triage"
version = "0.1.0"
description = "Triagem automática de laudos médicos por urgência — FIAP MLE10 Tech Challenge Fase 03"
authors = ["Tiago de Freitas Faustino <tiago.faustino@redeoba.com.br>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "triage", from = "src" }]

# Dependências mínimas compartilhadas por treino e inferência.
# pandas fica fora daqui: a inferência recebe listas de strings e não
# precisa dele, então a imagem da API não o carrega. O onnxruntime é
# compartilhado: serve o modelo otimizado na API e verifica a paridade da
# exportação no treino.
[tool.poetry.dependencies]
python = ">=3.11,<3.13"
scikit-learn = ">=1.5,<1.8"
numpy = ">=1.26,<3.0"
joblib = ">=1.4,<2.0"
pydantic = ">=2.8,<3.0"
pydantic-settings = ">=2.4,<3.0"
pyyaml = ">=6.0,<7.0"
onnxruntime = ">=1.20,<2.0"

# Usado apenas no pipeline de treino (leitura/avaliação do CSV e exportação
# do modelo para ONNX).
[tool.poetry.group.training.dependencies]
pandas = ">=2.2,<3.0"
skl2onnx = ">=1.18,<2.0"

# Busca de hiperparâmetros — etapa offline, fora das imagens Docker.
[tool.poetry.group.tuning.dependencies]
optuna = ">=4.0,<6.0"

# Serviço de inferência — instalado apenas na imagem da API.
[tool.poetry.group.api.dependencies]
fastapi = ">=0.115,<1.0"
uvicorn = { version = ">=0.30,<1.0", extras = ["standard"] }
prometheus-client = ">=0.21,<1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^5.0"
ruff = "^0.6"
pre-commit = "^3.8"
httpx2 = ">=2.0,<3.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ANN", "D", "SIM"]
ignore = ["D203", "D213", "D105", "D107", "ANN101", "ANN102"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]
"airflow/tests/*" = ["D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
