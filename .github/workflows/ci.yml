name: CI/CD

# lint -> testes (Python 3.11 e 3.12) + integridade da DAG -> build e smoke
# test das imagens Docker -> publicação da imagem da API no GHCR (só main).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  POETRY_VERSION: "2.4.3"
  AIRFLOW_VERSION: "3.3.2"

jobs:
  lint:
    name: Lint e formatação (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Poetry
        run: pipx install "poetry==${POETRY_VERSION}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: poetry

      - name: Instalar dependências de desenvolvimento
        run: poetry install --only dev --no-root --no-interaction

      - name: Lint
        run: poetry run ruff check .

      - name: Formatação
        run: poetry run ruff format --check .

  test:
    name: Testes (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Poetry
        run: pipx install "poetry==${POETRY_VERSION}"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry

      - name: Instalar dependências
        run: poetry install --no-interaction

      - name: Testes com cobertura
        run: poetry run pytest --cov=triage --cov-report=term --cov-report=xml

      - name: Publicar relatório de cobertura
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  dag:
    name: Integridade da DAG (Airflow)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml

      - name: Instalar Airflow (com constraints oficiais)
        run: |
          pip install "apache-airflow==${AIRFLOW_VERSION}" pytest \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-3.12.txt"

      - name: Validar a DAG
        env:
          AIRFLOW_HOME: ${{ runner.temp }}/airflow
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        run: python -m pytest airflow/tests -o addopts= -q

  docker-api:
    name: Build e smoke test da API (Docker)
    needs: [test, dag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build da imagem (treina o modelo no build)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: triage-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Subir o container
        run: docker run -d --name triage-api -p 8000:8000 triage-api:ci

      - name: Aguardar readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/ready; then exit 0; fi
            sleep 2
          done
          docker logs triage-api
          exit 1

      - name: Smoke test de predição
        run: |
          response=$(curl -fsS -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"text": "Patient admitted with acute chest pain radiating to the left arm, ST-segment elevation and elevated troponin levels."}')
          echo "$response"
          echo "$response" | grep -q '"label":"urgente"'

      - name: Logs do container
        if: always()
        run: docker logs triage-api || true

  docker-airflow:
    name: Build da imagem do Airflow
    needs: [test, dag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          file: airflow/Dockerfile
          load: true
          tags: triage-airflow:ci
          cache-from: type=gha,scope=airflow
          cache-to: type=gha,scope=airflow,mode=max

      - name: Validar o venv de ML dentro da imagem
        run: |
          docker run --rm --entrypoint /opt/triage/.venv/bin/python triage-airflow:ci \
            -c "import sklearn, triage.pipeline.steps; print('scikit-learn', sklearn.__version__)"

      - name: Validar a DAG dentro da imagem
        run: |
          docker run --rm --entrypoint python triage-airflow:ci -c "
          from airflow.dag_processing.dagbag import DagBag
          bag = DagBag('/opt/airflow/dags')
          assert not bag.import_errors, bag.import_errors
          print(sorted(bag.dag_ids))
          "

  publish:
    name: Publicar imagem da API (GHCR)
    needs: [docker-api, docker-airflow]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/triage-api
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
