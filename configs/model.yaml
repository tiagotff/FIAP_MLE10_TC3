# Gerado por `python -m triage.training.tune` — não editar à mão.
# Melhor F1 macro na validação: 0.8167 (trial 79 de 100).
vectorizer:
  ngram_range:
  - 1
  - 1
  stop_words: english
  lowercase: true
  max_features: 30000
  min_df: 1
  max_df: 0.5546183574449741
  sublinear_tf: false
classifier:
  name: logistic_regression
  params:
    logistic_regression:
      max_iter: 3000
      class_weight: balanced
      C: 2.3138190262408567
