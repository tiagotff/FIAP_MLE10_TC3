# Datasource provisionado automaticamente na subida do Grafana.
# O uid fixo é referenciado pelos painéis do dashboard.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 5s
