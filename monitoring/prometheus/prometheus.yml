# Coleta das métricas da API de triagem.
#
# Intervalo curto (5s) para o dashboard reagir rápido durante a
# demonstração; em produção, 15-30s costuma bastar.

global:
  scrape_interval: 5s
  evaluation_interval: 15s
  external_labels:
    project: triage

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: triage-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: triage-api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
